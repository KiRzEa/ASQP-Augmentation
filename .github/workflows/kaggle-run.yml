# Publish một release (hoặc bấm tay) thì gửi round thực nghiệm này cho bot message-talisman,
# bot đẩy lên Kaggle và báo kết quả trên Discord.
#
# Cần: secret CI_RUN_SECRET và variable KAGGLE_BOT_URL (không dấu `/` cuối), ở cấp repo hoặc org.
# Release đánh dấu pre-release chỉ chạy dry_run (xem kế hoạch chọn account, không chạy).
# KHÔNG chạy mỗi commit: mỗi lần chạy tốn quota GPU của một thành viên.
name: kaggle-run
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run: { description: "Chỉ xem kế hoạch chọn tài khoản, không chạy", type: boolean, default: false }
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Chặn trước khi tốn quota: manifest lệch plan thì có session chạy rỗng hoặc job không ai chạy;
      # round đã xong thì release sẽ chạy lại những job đã có kết quả.
      - name: Manifest phải khớp plan, round chưa xong, tag khớp round
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dry=false
          if [ "${IN_DRY:-false}" = "true" ] || [ "${IS_PRERELEASE:-false}" = "true" ]; then dry=true; fi
          round=$(jq -r '.round' experiments/run_plan.json)
          want=$(jq -c '[.sessions[].session]' experiments/run_plan.json)
          got=$(yq -o=json -I=0 '.sessions' kaggle-run.yml)
          echo "plan $round: sessions $want; kaggle-run.yml: $got"
          [ "$want" = "$got" ] || {
            echo "::error::kaggle-run.yml khai sessions=$got nhưng experiments/run_plan.json ($round) có $want. Chạy lại 'python3 scripts/kaggle_queue.py plan' rồi commit cả hai file."
            exit 1
          }
          for r in $(jq -r '.rounds[]' experiments/run_plan.json); do
            st=$(jq -r --arg r "$r" '.rounds[$r].status // ""' experiments/rounds.json)
            case "$st" in done*)
              if [ "$dry" = "true" ]; then  # a dry run starts nothing, so it may test the pipeline on a finished round
                echo "::warning::round '$r' đã xong; chỉ diễn tập nên vẫn cho qua."
              else
                echo "::error::round '$r' đã xong (${st:0:40}...). Lập plan cho round mới trước khi tạo release."
                exit 1
              fi;;
            esac
          done
          tag="${RELEASE_TAG:-}"
          case "$tag" in
            "") echo "chạy tay: bỏ qua kiểm tra tag";;
            ci-smoke-*)
              # kaggle-run.yml luôn trỏ vào plan thật của round, nên một release ci-smoke thật sẽ chạy cả round
              # dưới nhãn sai. Thử hạ tầng ở repo này chỉ bằng diễn tập.
              [ "$dry" = "true" ] || {
                echo "::error::tag '$tag' chỉ được dùng để diễn tập (pre-release, hoặc: gh workflow run kaggle-run.yml -f dry_run=true). Release thật sẽ chạy toàn bộ plan '$round'; muốn chạy round thì đặt tag '$round'."
                exit 1
              }
              echo "tag '$tag': diễn tập hạ tầng";;
            *) base=${tag%%.*}
               [ "$base" = "$round" ] || {
                 echo "::error::release gắn tag '$tag' nhưng plan đang ở round '$round'. Đặt tag '$round' (hoặc '$round.<k>' khi gửi lại)."
                 exit 1
               }
               echo "tag '$tag' khớp round '$round'";;
          esac

      - name: Gọi bot chạy thực nghiệm trên Kaggle
        env:
          CI_RUN_SECRET: ${{ secrets.CI_RUN_SECRET }}
          BOT_URL: ${{ vars.KAGGLE_BOT_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          : "${CI_RUN_SECRET:?secret CI_RUN_SECRET chưa được đặt cho repo}"
          : "${BOT_URL:?variable KAGGLE_BOT_URL chưa được đặt cho repo}"
          dry=false
          why=""
          if [ "${IN_DRY:-false}" = "true" ]; then dry=true; why="dry_run được chọn khi bấm chạy"; fi
          if [ "${IS_PRERELEASE:-false}" = "true" ]; then dry=true; why="release này được đánh PRE-RELEASE"; fi
          if [ "$dry" = "true" ]; then
            echo "::warning title=Diễn tập, không chạy thật::$why. Bot chỉ in kế hoạch chọn tài khoản; KHÔNG có session nào được đẩy lên Kaggle. Muốn chạy thật: Actions -> kaggle-run -> Run workflow, bỏ tick dry_run. (Bỏ tick pre-release rồi Lưu sẽ KHÔNG kích hoạt lại: GitHub bắn 'released', workflow này nghe 'published'.)"
          fi
          tag=${RELEASE_TAG:-$(git rev-parse --short HEAD)}
          body=$(yq -o=json kaggle-run.yml | jq -c --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg tag "$tag" --argjson dry "$dry" \
            '{repo:$repo, sha:$sha, tag:$tag, manifest:., dry_run:$dry}')
          ts=$(date +%s)000
          sig=$(printf '%s.%s' "$ts" "$body" | openssl dgst -sha256 -hmac "$CI_RUN_SECRET" -hex | sed 's/^.* //')
          curl -sS --fail-with-body -X POST "$BOT_URL/ci/kaggle-run" -H "content-type: application/json" \
            -H "x-ci-timestamp: $ts" -H "x-ci-signature: sha256=$sig" --data-binary "$body" | tee response.json | jq .
          jq -e '.ok == true' response.json > /dev/null
